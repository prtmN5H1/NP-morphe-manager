name: Custom Morphe Manager - upstream sync, build and release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'patcher-core/**'
      - 'gradle/**'
      - '.github/workflows/**'
      - '*.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: write
  actions: write
  packages: read

concurrency:
  group: custom-morphe-main-sync-build
  cancel-in-progress: false

jobs:
  sync-upstream:
    name: Sync official Morphe main into custom main
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Check out custom main with full history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Merge latest official Morphe main
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MorpheApp/morphe-manager.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Custom main already contains official upstream main."
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "::error::Upstream changes conflict with custom changes. Nothing was pushed or released. Resolve the conflict, then rerun this workflow."
            exit 1
          fi

  build-custom-apk:
    name: Build merged custom APK
    needs: sync-upstream
    if: needs.sync-upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out merged custom main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Build debug APK
        env:
          GITHUB_TOKEN: ${{ secrets.MORPHE_GPR_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: morphe-custom-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Start signed semantic release after upstream update
        if: needs.sync-upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
